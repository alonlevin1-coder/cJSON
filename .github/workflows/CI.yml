name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  linux:
    name: cJSON Build & Test in MicroVM
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mem_check:
          - NONE_MEM_CHECK
        compiler:
          - GCC
    steps:
    - name: Checkout cJSON source
      uses: actions/checkout@v4

    - name: Checkout MicroVM Action
      uses: actions/checkout@v4
      with:
        repository: alonlevin1-coder/runner-criu-test
        ref: port/is-vm-worker-migration
        token: ${{ secrets.ACTION_PAT }}
        path: .github/actions/microvm

    - name: Migrate Runner to MicroVM
      uses: ./.github/actions/microvm
      with:
        tcp-mode: established
        memory-mb: '4096'
        smp: '2'

    - name: Verify MicroVM Execution
      run: |
        echo "=== Environment Info ==="
        echo "Kernel: $(uname -r)"
        echo "Hostname: $(hostname)"
        [ -f /tmp/is_vm ] || { echo "FAIL: Not in MicroVM"; exit 1; }
        echo "CONFIRMED: Executing natively in MicroVM!"

    - name: install build dependencies
      run: |
        echo "Testing sudo inside MicroVM..."
        sudo apt-mark unhold libc6 libc6-dev libssl3 libssl-dev 2>/dev/null || true
        sudo apt-get install -y valgrind || true


    - name: build and test
      shell: bash
      run: |
          if [ "${{ matrix.mem_check }}" == "ENABLE_VALGRIND" ]; then
            EVENT_CMAKE_OPTIONS="-DENABLE_CJSON_UTILS=ON -DENABLE_VALGRIND=ON -DENABLE_SAFE_STACK=ON -DENABLE_SANITIZERS=OFF"
          elif [ "${{ matrix.mem_check }}" == "ENABLE_SANITIZERS" ]; then
            EVENT_CMAKE_OPTIONS="-DENABLE_CJSON_UTILS=ON -DENABLE_VALGRIND=OFF -DENABLE_SAFE_STACK=OFF -DENABLE_SANITIZERS=ON"
          else
            EVENT_CMAKE_OPTIONS="-DENABLE_CJSON_UTILS=ON -DENABLE_VALGRIND=OFF -DENABLE_SAFE_STACK=OFF -DENABLE_SANITIZERS=OFF"
          fi
          if [ "${{ matrix.compiler }}" == "GCC" ]; then
            export CC=gcc
          else
            export CC=clang
          fi
          #run build and test
          JOBS=2
          export CTEST_PARALLEL_LEVEL=$JOBS
          export CTEST_OUTPUT_ON_FAILURE=1
          mkdir -p build
          cd build
          echo [cmake]: cmake .. $EVENT_CMAKE_OPTIONS
          cmake .. $EVENT_CMAKE_OPTIONS || (rm -rf * && cmake .. $EVENT_CMAKE_OPTIONS)
          cmake --build .
          make
          make test
